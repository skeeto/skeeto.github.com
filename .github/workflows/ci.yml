# Test ssg: Debug (UBSan) build, unit tests, and a full site build.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build (Debug)
        run: |
          cmake -S _ssg -B _ssg/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build _ssg/build
      - name: Unit tests
        run: ctest --test-dir _ssg/build --output-on-failure
      - name: Generate site
        run: _ssg/build/ssg -o _site
